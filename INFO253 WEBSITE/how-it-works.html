<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online GP · How it works, Messages, Contact us</title>
<style>
/* Layout: a calm public site with a sunrise motif, a patient portal (sidebar + workspace), and a clinician console; a dark prototype bar sits above everything and is not part of the site. */
:root{
  --ink:#0E2E33; --ink-2:#36545A; --muted:#5A7378;
  --bg:#F2F6F5; --surface:#FFFFFF; --line:#D3E0DD; --line-2:#E6EEEC;
  --teal:#0F7466; --teal-d:#0A574D; --teal-50:#E2F1ED;
  --sun:#F2B33D; --sun-d:#8A5A00; --sun-50:#FDF1D6;
  --red:#B42318; --red-50:#FDECEA; --ok:#1E7B3A; --ok-50:#E4F4E8;
  --proto:#1B1F24; --proto-fg:#E9EEF0; --proto-mute:#9AA6AD;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; --r-lg:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;color:var(--ink);margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:800}
h2{font-size:clamp(1.5rem,2.8vw,2.1rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--teal-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--teal-d)}
.stack{display:flex;flex-direction:column;gap:var(--g,16px)}
.row{display:flex;flex-wrap:wrap;gap:var(--g,12px);align-items:center}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.section{padding-block:56px}
.grid{display:grid;gap:var(--g,20px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.card.flat{border:none;background:transparent;padding:0}
.tint{background:var(--teal-50);border-color:transparent}
.sunbox{background:var(--sun-50);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:2px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-d)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-d)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{min-height:38px;padding:0 14px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:none;padding:0;color:var(--teal-d);text-decoration:underline;cursor:pointer;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-50);color:var(--ok)}
.pill.warn{background:var(--sun-50);color:var(--sun-d)}
.pill.bad{background:var(--red-50);color:var(--red)}
.pill.teal{background:var(--teal-50);color:var(--teal-d)}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.big-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--teal-50);color:var(--teal-d);flex:none}
.big-ico .ico{width:24px;height:24px}
hr.sep{border:none;border-top:1px solid var(--line);margin:0}

/* Prototype bar (not part of the site) */
#proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--proto);color:var(--proto-fg);font-family:var(--f-mono);font-size:12.5px}
#proto .in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 16px;max-width:1400px;margin:0 auto}
#proto .tag{background:var(--sun);color:#1B1F24;font-weight:500;padding:2px 7px;border-radius:4px;letter-spacing:.06em}
#proto select{background:#2A3037;color:var(--proto-fg);border:1px solid #3A424B;border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:12.5px;max-width:58vw}
#proto button{background:#2A3037;color:var(--proto-fg);border:1px solid #3A424B;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12.5px}
#proto button:hover{border-color:var(--sun)}
#proto .sp{flex:1}
#proto .note{color:var(--proto-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 220px}

/* Public site chrome */
.alertbar{background:var(--ink);color:#DCEAE7;font-size:.86rem}
.alertbar .wrap{display:flex;gap:6px 18px;flex-wrap:wrap;padding-block:7px}
.alertbar b{color:#fff}
.sitehead{background:var(--surface);border-bottom:1px solid var(--line)}
.sitehead .wrap{display:flex;align-items:center;gap:20px;min-height:74px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;cursor:pointer;background:none;border:none;padding:0}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;letter-spacing:.02em;color:var(--muted);margin-top:-2px}
.mainnav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.mainnav a{padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:.97rem}
.mainnav a:hover{background:var(--teal-50);color:var(--teal-d)}
.mainnav a[aria-current="page"]{color:var(--teal-d);box-shadow:inset 0 -3px 0 var(--teal)}
.menubtn{display:none}
@media (max-width:900px){
  .mainnav{display:none;order:5;flex-basis:100%;flex-direction:column}
  .mainnav.open{display:flex}
  .menubtn{display:inline-flex}
  .head-actions .signin{display:none}
}
.head-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
.crumbs{font-size:.88rem;color:var(--muted);padding-top:22px}
.crumbs a{color:var(--muted)}
.pagehead{padding-block:28px 8px}
.pagehead p{max-width:62ch;margin-top:10px;font-size:1.08rem;color:var(--ink-2)}
.sitefoot{background:var(--ink);color:#C9D9D6;margin-top:40px}
.sitefoot .wrap{padding-block:44px;display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.sitefoot h4{color:#fff;margin-bottom:10px}
.sitefoot a{color:#C9D9D6;display:block;padding:3px 0;text-decoration:none;cursor:pointer}
.sitefoot a:hover{color:#fff;text-decoration:underline}
.sitefoot .legal{grid-column:1/-1;border-top:1px solid #2A4A50;padding-top:18px;font-size:.84rem;color:#9FB7B3}

/* Home */
.hero{background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%);border-bottom:1px solid var(--line);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:56px 64px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-art{max-width:420px;justify-self:center}}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%)}
.hero .lede{font-size:1.18rem;color:var(--ink-2);max-width:52ch;margin-top:16px}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:26px;font-size:.95rem;color:var(--ink-2)}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust .ico{color:var(--teal)}
.nextslot{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:.95rem;margin-bottom:22px}
.nextslot .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-50)}
.hero-art svg{width:100%;height:auto;display:block;max-width:100%}
.path-card{display:flex;flex-direction:column;gap:12px}
.path-card .price{font-family:var(--f-display);font-size:1.9rem;font-weight:800}
.path-card .price small{font-family:var(--f-body);font-size:.9rem;font-weight:400;color:var(--muted)}
.steps{counter-reset:s;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.steps li{list-style:none;counter-increment:s;display:flex;flex-direction:column;gap:8px}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:1.1rem;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--ink)}
.steps{padding:0;margin:0}
.cando li,.cannot li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line-2)}
.cando ul,.cannot ul{list-style:none;margin:0;padding:0}
.cando .ico{color:var(--ok);margin-top:3px}
.cannot .ico{color:var(--sun-d);margin-top:3px}

/* Doctors */
.avatar{width:var(--s,56px);height:var(--s,56px);border-radius:50%;display:grid;place-items:center;background:var(--teal-50);color:var(--teal-d);font-family:var(--f-display);font-weight:800;font-size:calc(var(--s,56px)*.36);flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.doc-card{display:flex;flex-direction:column;gap:14px}
.doc-card .top{display:flex;gap:14px;align-items:center}
.reg{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ok);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-block:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-weight:700;font-size:.95rem}
.req{font-weight:700;font-size:.74rem;color:var(--red);background:var(--red-50);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.02em}
.opt{font-weight:700;font-size:.74rem;color:var(--muted);background:var(--line-2);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.hint{font-size:.86rem;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],select,textarea{min-height:48px;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-50)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--teal);flex:none}
.check:has(input:checked){border-color:var(--teal);background:var(--teal-50)}
.choice{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.choice:hover{border-color:var(--teal)}
.choice[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-50);box-shadow:inset 0 0 0 1px var(--teal)}
.choice .t{font-weight:700}
.choice .d{font-size:.88rem;color:var(--muted)}

/* Pricing */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
.calc-out{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-variant-numeric:tabular-nums}
.breakdown .tot{font-weight:700;border-top:1px solid var(--line);padding-top:8px}

/* Accordion */
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;padding:16px 4px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-family:var(--f-display);font-size:1.4rem;line-height:1;color:var(--teal)}
details.faq[open] summary::after{content:"–"}
details.faq p{padding:0 4px 16px;color:var(--ink-2);max-width:68ch}

/* Portal */
.portal{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 110px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:700;cursor:pointer}
.side a:hover{background:var(--bg)}
.side a[aria-current="page"]{background:var(--teal-50);color:var(--teal-d)}
.side .who{padding:6px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.pmain{padding:28px clamp(16px,3vw,40px) 48px;min-width:0;max-width:1100px}
@media (max-width:820px){
  .portal{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 12px;gap:2px}
  .side .who,.side .foot{display:none}
  .side a{white-space:nowrap;padding:9px 12px}
}
.porthead{background:var(--surface);border-bottom:1px solid var(--line)}
.porthead .in{display:flex;gap:16px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;padding:0;list-style:none}
.stepper li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;color:var(--muted);padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stepper li b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-size:.85rem}
.stepper li.on{color:var(--teal-d);border-color:var(--teal)}
.stepper li.on b{background:var(--teal);color:#fff}
.stepper li.done b{background:var(--ok-50);color:var(--ok)}
.emergency{border:2px solid var(--red);background:var(--red-50);border-radius:var(--r-lg);padding:20px;display:flex;gap:14px}
.emergency .ico{color:var(--red);width:28px;height:28px}
.daychips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.daychip{flex:none;min-width:84px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;line-height:1.25}
.daychip b{display:block;font-family:var(--f-display);font-size:1.25rem}
.daychip small{display:block;font-size:.76rem;color:var(--muted)}
.daychip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#fff}
.daychip[aria-pressed="true"] small{color:#D4EEE8}
.daychip.full small{color:var(--red)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.slot:hover{border-color:var(--teal)}
.slot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.docslot{display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:start}
@media (max-width:560px){.docslot{grid-template-columns:1fr}}
.summary{position:sticky;top:60px}
.apt{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
@media (max-width:640px){.apt{grid-template-columns:auto 1fr}.apt .acts{grid-column:1/-1}}
.datebox{width:64px;text-align:center;border-radius:12px;background:var(--teal-50);color:var(--teal-d);padding:8px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--f-display);font-size:1.5rem}
.datebox small{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.checkrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2)}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}*{transition:none!important}}
.preview{aspect-ratio:16/10;max-width:100%;border-radius:var(--r-lg);background:linear-gradient(160deg,#20454B,#0E2E33);display:grid;place-items:center;color:#CFE3DF;position:relative;overflow:hidden}
.meter{display:flex;gap:3px;align-items:flex-end;height:22px}
.meter i{width:5px;background:var(--line);border-radius:2px}
.meter.live i{background:var(--teal)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:none;padding:12px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--teal-d);border-bottom-color:var(--teal)}
.toggle{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line-2)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;inset:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--teal)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
.doc-paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px;font-size:.95rem;box-shadow:0 8px 24px rgba(14,46,51,.08)}

/* Call */
.call{background:#0B2226;border-radius:var(--r-lg);overflow:hidden;color:#E4F0EE;display:grid;grid-template-columns:1fr 300px;min-height:520px}
@media (max-width:900px){.call{grid-template-columns:1fr}}
.stage{position:relative;display:grid;place-items:center;min-height:420px;background:radial-gradient(ellipse at 50% 30%,#24545B 0%,#0B2226 70%)}
.selfview{position:absolute;right:16px;bottom:86px;width:150px;aspect-ratio:4/3;max-width:40%;border-radius:12px;background:#36565B;border:2px solid #0B2226;display:grid;place-items:center;font-size:.8rem}
.controls{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.cbtn{width:52px;height:52px;border-radius:50%;border:none;background:#24464C;color:#fff;display:grid;place-items:center;cursor:pointer}
.cbtn.off{background:#fff;color:#0B2226}
.cbtn.end{background:var(--red);width:72px;border-radius:999px}
.callside{background:#102D32;padding:18px;display:flex;flex-direction:column;gap:14px;font-size:.92rem}
.callside .pill{background:#1D4248;color:#CFE3DF}
.cap{background:#0B2226;border-radius:10px;padding:10px 12px;line-height:1.45}
.cap b{color:var(--sun)}

/* GP console */
.gphead{background:var(--ink);color:#E4F0EE}
.gphead .in{display:flex;gap:16px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.gphead .logo{color:#fff}
.gphead .logo small{color:#9FB7B3}
.gpmain{padding:24px 20px 48px;max-width:1300px;margin:0 auto}
.queue td{vertical-align:middle}
.queue tr.clickable{cursor:pointer}

.inbox{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;height:calc(100vh - 210px);min-height:540px}

 casual:{label:'Casual visit',price:'$69',priceNote:'per consultation (adults). $49 for children under 14.',steps:[

   <div class="stack" style="--g:4px"><h2 style="margin-bottom:10px">Common questions</h2>
    ${[['Are the doctors real GPs?','Yes. Every doctor is a vocationally registered GP. Their Medical Council registration number is on their profile, so you can check it yourself.'],
       ['Will the call be recorded?','No. If you choose to allow transcription when you book, an AI tool writes draft notes for your doctor, who checks them before saving. The audio is deleted after 24 hours. It’s off unless you turn it on.'],

   <div class="stack" style="--g:16px">

function porthead(){return `${alertbar()}<header class="porthead"><div class="in">${logo('Patient portal')}<span style="flex:1"></span><span class="pill ok">${I('check')} Enrolled · Health NZ funded</span><button class="btn btn-ghost btn-sm" data-go="how">${I('out')} Sign out</button></div></header>`}
function portal(body){
  const unread=THREADS.filter(t=>t.unread).length;
  const items=[['My Appointments','cal'],['Messages','msg'],['Prescriptions','pill'],['Medical Certificates','doc'],['My Profile','user']];
  return porthead()+`<div class="portal"><nav class="side" aria-label="Portal">
   <div class="who"><div class="row" style="--g:10px"><span class="avatar" style="--s:42px">SP</span><div><b>Sam Patel</b><div class="small muted">NHI <span class="mono">ZZZ0016</span></div></div></div></div>
   ${items.map(([t,ic])=>t==='Messages'?`<a href="#messages" data-go="messages" aria-current="page">${I(ic)}${t}${unread?`<span class="pill teal" style="margin-left:auto">${unread}</span>`:''}</a>`:`<a href="#" data-other="${t}">${I(ic)}${t}</a>`).join('')}
   <div class="foot small muted" style="margin-top:auto;padding:16px 12px 0">Need help? <button class="linkbtn" data-go="contact">Contact us</button></div>
  </nav><main class="pmain" id="main" style="max-width:none;padding-block:20px">${body}</main></div>`;
}
function bubble(m){
  if(m.day) return `<span class="daysep">${m.day}</span>`;
  if(m.who==='sys') return `<div class="bubble sys">${m.t}</div>`;
  return `<div class="bubble ${m.who}">${esc(m.t)}${m.file?`<div class="attach">${I('doc')}<span>${esc(m.file)}</span></div>`:''}<span class="st">${m.time}${m.st?' · '+m.st:''}</span></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function vMessages(){
  const ib=S.inbox;
  const list=THREADS.filter(t=>ib.filter==='all'||(ib.filter==='unread'&&t.unread)||(ib.filter==='gp'&&t.id==='t1'));

  const urgent=flagged?`<div class="emergency" role="alert">${I('alert')}<div class="stack" style="--g:4px"><b>This sounds urgent. Please don't wait for a message.</b><p class="small">Call <b>111</b> now. If you're thinking about ending your life, call or text <b>1737</b>.</p></div></div>`:'';

  if(ib.compose){
    right=`<div class="ithread"><div class="th-head"><button class="btn btn-ghost btn-sm backlink" data-act="back">← Inbox</button><h2 style="font-size:1.25rem">New message</h2></div>

       <div class="field"><label for="n-to">To <span class="req">Required</span></label><select id="n-to" data-bind="inbox.newTo">${Object.entries(RECIP).map(([k,v])=>`<option value="${k}" ${ib.newTo===k?'selected':''}>${v}</option>`).join('')}</select></div>
       <div class="field"><label for="n-topic">About</label><select id="n-topic" data-bind="inbox.newTopic">${['Question about my treatment','Test results','Prescription','Booking or payment','Technical problem','Something else'].map(o=>`<option ${ib.newTopic===o?'selected':''}>${o}</option>`).join('')}</select></div>

      <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:16px"><span class="small muted">${I('lock')} Only ${ib.newTo==='mere'?'Dr Tipene and the nurses in your care team':'the '+RECIP[ib.newTo].split(' (')[0]} can read this.</span><div class="row"><button type="button" class="btn btn-ghost" data-act="discard">Discard</button><button class="btn btn-primary" type="submit">Send message</button></div></div>
     </form></div>`;

    right=`<div class="ithread"><div class="th-head"><button class="btn btn-ghost btn-sm backlink" data-act="back">← Inbox</button><span class="avatar" style="--s:52px">${t.init}</span><div style="flex:1;min-width:160px"><h2 style="font-size:1.3rem">${t.subject}</h2><p class="small muted">${t.from} · ${t.role}</p></div>${t.id==='t1'?'<span class="pill teal">Free follow-up · 7 days left</span>':''}</div>

  }

    <div class="ilist"><div class="lhead"><h1 style="font-size:1.6rem">Messages</h1><button class="iconbtn" data-act="compose" aria-label="New message" title="New message">${I('msg')}</button></div>
     ${list.length?list.map(x=>{const last=[...x.msgs].reverse().find(m=>m.t&&m.who!=='sys');return `<button class="thread-item ${x.unread?'unread':''}" data-act="open" data-v="${x.id}" aria-current="${!ib.compose&&ib.sel===x.id}"><span class="avatar" style="--s:42px">${x.init}</span><span style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="top"><span class="who-n">${x.from}</span></span><span class="small" style="font-weight:700">${x.subject}</span><span class="prev">${last?(last.who==='me'?'You: ':'')+esc(last.t):''}</span></span></button>`}).join(''):`<p class="muted small" style="padding:18px">No unread messages.</p>`}

    </div>
    ${right||`<div class="ithread" style="display:grid;place-items:center;padding:30px"><p class="muted">Choose a conversation.</p></div>`}
   </div>`);
}

      <dl class="kv" style="gap:10px 18px">
       <dt>Privacy officer</dt><dd><span class="mono small">privacy@onlinegp.example</span><div class="small muted">Ask for a copy of your records or a correction</div></dd>
       <dt>Clinics & records</dt><dd><span class="mono small">records@onlinegp.example</span><div class="small muted">Practices sending or requesting patient records</div></dd>
       <dt>Work with us</dt><dd><span class="mono small">careers@onlinegp.example</span><div class="small muted">NZ-registered GPs and nurses</div></dd>
       <dt>Media</dt><dd><span class="mono small">media@onlinegp.example</span></dd>
      </dl></div>
    </div>
   </div>

   <div class="stack" style="--g:16px"><h2>Feedback and complaints</h2><p class="muted" style="max-width:66ch">We want to hear when something goes wrong. This is how a complaint is handled, under the Code of Health and Disability Services Consumers' Rights.</p>
    <ol class="complain">
     <li><b>Tell us</b><span class="small muted">Use the form above, email, or phone support. You can make a complaint on behalf of someone else.</span></li>
     <li><b>We acknowledge it</b><span class="small muted">Within 5 working days, with the name of the person handling it.</span></li>
     <li><b>We look into it</b><span class="small muted">We'll talk to you and the people involved, and keep you updated.</span></li>
     <li><b>Still not happy?</b><span class="small muted">You can contact the <a href="https://www.hdc.org.nz/" target="_blank" rel="noopener">Health and Disability Commissioner</a>, which is free and independent.</span></li>
    </ol></div>
  </div></section>`,'Contact us');
}

/* ---------- Router ---------- */
const VIEWS={how:vHow,messages:vMessages,contact:vContact};
const app=document.getElementById('app');
function render(keep){const y=window.scrollY;app.innerHTML=VIEWS[S.page]();document.querySelectorAll('.ownbtn').forEach(b=>b.setAttribute('aria-current',b.dataset.go===S.page?'page':'false'));document.getElementById('protonote').textContent='Supports: '+OWN[S.page].sup;if(keep)window.scrollTo(0,y);const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
function go(id){if(!VIEWS[id])return;S.page=id;S.menu=false;try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo(0,0);const m=document.getElementById('main');if(m){m.setAttribute('tabindex','-1');m.focus({preventScroll:true})}}
let tt;function toast(msg){const t=document.getElementById('toast');t.innerHTML=I('check')+'<span>'+msg+'</span>';t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3800)}
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=v}
function nowTime(){return '10:'+String(14+Math.floor(Math.random()*40)).padStart(2,'0')+' am'}
const ACT={
 menu(){S.menu=!S.menu;render(true)},
 path(el){S.path=el.dataset.v;render(true)},
 open(el){const t=THREADS.find(x=>x.id===el.dataset.v);t.unread=false;S.inbox.sel=t.id;S.inbox.compose=false;S.inbox.draft='';S.inbox.attach=null;render(true)},
 back(){S.inbox.sel=null;S.inbox.compose=false;render(true)},
 ifilter(el){S.inbox.filter=el.dataset.v;render(true)},
 compose(){Object.assign(S.inbox,{compose:true,newBody:'',newErr:false,attach:null});render(true);document.getElementById('n-body')?.focus()},
 discard(){S.inbox.compose=false;S.inbox.sel=S.inbox.sel||'t1';render(true)},
 copy(el){const v=el.dataset.v;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copied '+v)).catch(()=>toast('Select the text to copy it: '+v))},
 newcontact(){S.contact={sent:null,err:{}};render(true)}
};
document.addEventListener('click',e=>{
 const o=e.target.closest('[data-other]');
 if(o){e.preventDefault();toast(`"${o.dataset.other}" is built by another team member. It's in the full group prototype.`);return}
 const g=e.target.closest('[data-go]');
 if(g){e.preventDefault();go(g.dataset.go);return}
 const a=e.target.closest('[data-act]');
 if(a&&ACT[a.dataset.act]&&a.type!=='file'){e.preventDefault();ACT[a.dataset.act](a,e)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.type==='file'){S.inbox.attach=el.files[0]?el.files[0].name:null;render(true);return}
 if(el.dataset.bind&&!el.dataset.live){setPath(el.dataset.bind,el.value);render(true)}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.live){setPath(el.dataset.bind,el.value);const slot=document.getElementById('urgent-slot');const hit=RED.test(el.value);if(slot&&hit!==!!slot.innerHTML.trim()){slot.innerHTML=hit?`<div class="emergency" role="alert">${I('alert')}<div class="stack" style="--g:4px"><b>This sounds urgent. Please don't wait for a message.</b><p class="small">Call <b>111</b> now. If you're thinking about ending your life, call or text <b>1737</b>.</p></div></div>`:''}}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;const ib=S.inbox;
 if(f==='reply'){
  if(!ib.draft.trim()&&!ib.attach){document.getElementById('r-body').focus();return}
  const t=THREADS.find(x=>x.id===ib.sel);const last=t.msgs.filter(m=>m.day).at(-1);
  if(!last||last.day!=='Today')t.msgs.push({day:'Today'});
  t.msgs.push({who:'me',t:ib.draft.trim()||'Photo attached',file:ib.attach,time:nowTime(),st:'Delivered'});
  ib.draft='';ib.attach=null;render(true);
  setTimeout(()=>{t.msgs.at(-1).st='Read';t.msgs.push({who:'sys',t:`${t.from.split(' ').slice(0,2).join(' ')} has seen your message and usually replies within a few hours.`});if(S.page==='messages'&&ib.sel===t.id)render(true)},2200);
 }
 if(f==='newmsg'){
  if(!ib.newBody.trim()){ib.newErr=true;render(true);document.getElementById('n-body').focus();return}
  const id='t'+Date.now();const name=RECIP[ib.newTo].split(' (')[0];
  THREADS.unshift({id,from:name,init:ib.newTo==='mere'?'MT':name[0],role:ib.newTo==='mere'?'Your GP':'Online GP',subject:ib.newTopic,unread:false,msgs:[{day:'Today'},{who:'me',t:ib.newBody.trim(),file:ib.attach,time:nowTime(),st:'Delivered'},{who:'sys',t:'Sent. You’ll get a text when there’s a reply.'}]});
  Object.assign(ib,{compose:false,sel:id,newBody:'',attach:null,newErr:false});render(true);toast('Message sent securely');
 }
 if(f==='contact'){
  const v=id=>document.getElementById(id).value.trim();
  const err={topic:!v('c-topic'),name:!v('c-name'),email:!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('c-email')),msg:!v('c-msg')};
  if(Object.values(err).some(Boolean)){
   const vals={topic:v('c-topic'),name:v('c-name'),email:v('c-email'),phone:v('c-phone'),via:v('c-via'),msg:v('c-msg')};
   S.contact.err=err;render(true);
   document.getElementById('c-topic').value=vals.topic;document.getElementById('c-name').value=vals.name;document.getElementById('c-email').value=vals.email;document.getElementById('c-phone').value=vals.phone;document.getElementById('c-via').value=vals.via;document.getElementById('c-msg').value=vals.msg;
   document.querySelector('.invalid')?.focus();return}
  S.contact={sent:{ref:'CU-20261006-'+(1000+Math.floor(Math.random()*9000)),via:v('c-via')==='phone'?'phone':'email'},err:{}};render(true);
 }
});
const start=(location.hash||'').slice(1);if(VIEWS[start])S.page=start;
render();

</script>
