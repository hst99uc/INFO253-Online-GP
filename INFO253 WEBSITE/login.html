<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Sign In</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img class="logo" src="images/logo_nav.png" alt="logo">
            <nav>
                <ul class="nav_links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="find-gp.html">Find GP</a></li>
                    <li><a href="how-it-works.html">How it works</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="how-it-works.html#contact">Contact Us</a></li>
                </ul>
            </nav>
            <a class="cta" href="login.html"><button>Sign in</button></a>
            <a class="cta" href="my-appointment.html"><button>Book a GP</button></a>
        </header>
        
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <p>Please enter your details</p>
                    <h1>Welcome Back</h1>
                </div>

                <form class="form-box">
                    <div class="input-group">
                        <input type="email" id="email" class="input-field" placeholder="">
                        <label for="email" class="floating-label">Email address</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" class="input-field" placeholder="">
                        <label for="password" class="floating-label">Password</label>
                    <div class="eye-icon" onclick="togglePassword()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    </div>
                    <div class="input-group checkbox-group">
                        <div class="form-col remember-me">
                            <input type="checkbox" id="remember-me-checkbox" class="checkbox-field">
                            <label for="remember-me-checkbox">Remember me</label>
                        </div>
                        <div class="form-col">
                            <a href="#" class="form-link">Forgot password?</a>
                        </div>
                    </div>
                    <button type="button" class="form-btn form-btn--submit" onclick="window.location.href='my-profile.html'">Sign In</button>
                </form>

                <div class="form-divider">
                    <p>Or</p>
                </div>

                <div class="form-bottom">
                    <div class="form-socials">
                        <button class="form-btn form-btn--social">
                            <img src="images/google_fav.png" class="btn-icon" alt="social icon">
                        </button>
                        <button class="form-btn form-btn--social">
                            <img src="images/facebook_fav.png" class="btn-icon" alt="social icon">
                        </button>
                        <button class="form-btn form-btn--social">
                            <img src="images/apple_fav.png" class="btn-icon" alt="social icon">
                        </button>
                    </div>
                    <p>Don't have an account? <a href="#" class="form-link">Sign up</a></p>
                </div>
            </div>
        </div>

        <script>
            function togglePassword() {
                const passwordInput = document.getElementById("password");
                const eyeIcon = document.querySelector(".eye-icon");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    eyeIcon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-closed preview-icon"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>'
                } else {
                    passwordInput.type = "password";
                    eyeIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`;
                }
            }
        </script>    

    </body>
</html>
